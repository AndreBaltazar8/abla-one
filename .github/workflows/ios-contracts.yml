name: iOS and mobile backend contracts
on:
  push:
    branches: [feat/ios-host]
  workflow_dispatch:
    inputs:
      compiler_version:
        description: Released compiler containing the package-path cycle fix
        required: true
        default: 0.2.48
        type: string
permissions:
  contents: read
jobs:
  package-consumer:
    name: Fresh public iOS package subpaths
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Intentionally no repository checkout: relative workspace siblings must
      # not accidentally satisfy a broken public-package import.
      - uses: AndreBaltazar8/setup-abla@13c3fdc74b5961bf2d281b25c47e4b9ace18d11e
        with:
          version: ${{ inputs.compiler_version || '0.2.48' }}
      - name: Lock and compile exact public package modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-package-consumer"
          cd "$RUNNER_TEMP/ios-package-consumer"
          cat > abla.toml <<'EOF'
          name = "ios-package-consumer"
          version = "0.0.1"
          entry = "main.ab"
          EOF
          cat > main.ab <<'EOF'
          compile fun mobileSource(): ImportSource = gitImportSource(
              "abla-mobile", "https://github.com/AndreBaltazar8/abla-mobile.git",
              "rev", "6d9cfaf574031729d2426565c47bad9c20712a47")
          compile fun oneSource(): ImportSource = gitImportSource(
              "abla-one", "https://github.com/AndreBaltazar8/abla-one.git",
              "rev", "0ab017ff459d71c603c0b649cdd5739b3bae8ef6")
          import importSubpath(mobileSource(), "ios_runtime")
          import importSubpath(mobileSource(), "ios_build")
          import importSubpath(oneSource(), "backends/ios")
          fun services(): OneServices = OneIosServices()
          fun main: int = mobileIosApplicationProtocolVersion() - 1
          EOF
          ablac package update --project .
          ablac build main.ab --emit object -o consumer.o --fast --no-cache
          nm -gU consumer.o > symbols.txt
          test "$(grep -c ' _abla_mobile_application_protocol_version$' symbols.txt)" = 1
      - name: Retain consumer lock and object metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-ios-package-subpaths
          path: ${{ runner.temp }}/ios-package-consumer
          retention-days: 14
  mobile-contracts:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: abla-one
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AndreBaltazar8/abla-mobile
          ref: 6d9cfaf574031729d2426565c47bad9c20712a47
          path: abla-mobile
          persist-credentials: false
      - uses: AndreBaltazar8/setup-abla@13c3fdc74b5961bf2d281b25c47e4b9ace18d11e
        with:
          version: ${{ inputs.compiler_version || '0.2.48' }}
      - name: Test existing contracts and the iOS encoder
        working-directory: abla-one
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/one-ios-evidence"
          { git rev-parse HEAD; ablac --version; sw_vers; } | tee "$RUNNER_TEMP/one-ios-evidence/versions.txt"
          mkdir -p build
          ablac build tools/check-native-build-roots.ab -o build/check-native-build-roots --fast
          ablac build tests/ios_native_roots_probe.ab -o build/ios-native-roots-probe --fast
          build/ios-native-roots-probe 2>&1 | tee "$RUNNER_TEMP/one-ios-evidence/native-roots-probe.log"
          ablac build tests/ios_backend_exports.ab --emit object -o build/ios-backend-host.o --fast
          nm -gU build/ios-backend-host.o | grep '_abla_mobile_run'
          ablac test tests/unit/*.ab tests/backends/*.ab tests/integration/*.ab \
            tests/remote/client.ab tests/remote/routes.ab \
            2>&1 | tee "$RUNNER_TEMP/one-ios-evidence/contracts.log"
      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-ios-contracts
          path: ${{ runner.temp }}/one-ios-evidence
          retention-days: 14
